name: CI
on:
  push:
    paths: ['orchestration-api/**', 'ml/**', 'src/**', 'frontend/**', 'public/**', 'index.html', 'package.json', 'package-lock.json',
            'vite.config.*', 'tsconfig*.json', 'tailwind.config.*', 'postcss.config.*', '.github/workflows/ci.yml']
  pull_request:
    paths: ['orchestration-api/**', 'ml/**', 'src/**', 'frontend/**', 'public/**', 'index.html', 'package.json', 'package-lock.json',
            'vite.config.*', 'tsconfig*.json', 'tailwind.config.*', 'postcss.config.*', '.github/workflows/ci.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Real Postgres + pgvector for tests/test_postgres_integration.py (the tests recreate the transit tables).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      # Real ClickHouse server (the image pinned in docker-compose.yml) for tests/test_clickhouse_live.py:
      # native protocol + a real read-only user. The tests drop and recreate the `beattraffic` database.
      clickhouse:
        image: clickhouse/clickhouse-server:24.3-alpine
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ci-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports: ['9000:9000']
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping" --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: orchestration-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestration-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (live Postgres + live ClickHouse + embedded ClickHouse engine)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_CLICKHOUSE_HOST: localhost
          TEST_CLICKHOUSE_PASSWORD: ci-password
        run: python -m pytest tests -q
      # Train the (synthetic-data) LightGBM crowd model so the eval exercises the real ONNX path, not a stub.
      - name: Train crowd model
        working-directory: .
        run: python ml/train_crowd_model.py --rows 60000 --out "$RUNNER_TEMP/models"
      - name: Scenario eval (hard gates)
        env:
          CROWD_MODEL_PATH: ${{ runner.temp }}/models/crowd_model.onnx
        run: python -m eval.run_eval --forecaster onnx --out "$RUNNER_TEMP/eval_results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval_results.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx vite build

  web:
    # Next.js 15 app (frontend/): lint, typecheck, unit tests, production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
