services:
  slack-bot:
    image: node:20
    working_dir: /app
    volumes: ["./slack-bot:/app"]
    command: sh -c "npm install && npm run dev"
    env_file: ["./slack-bot/.env"]
    ports: ["3000:3000", "3001:3001"]
    depends_on:
      redis: { condition: service_healthy }
      orchestration-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

  orchestration-api:
    image: python:3.12
    working_dir: /app
    volumes: ["./orchestration-api:/app"]
    command: sh -c "pip install fastapi uvicorn[standard] && uvicorn main:app --host 0.0.0.0 --port 8000"
    env_file: ["./orchestration-api/.env"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health/summary"]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: noc
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 20s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    ports: ["3005:3000"]
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-clickhouse-datasource
    depends_on:
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: beattraffic
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  otp:
    image: opentripplanner/opentripplanner:2.5.0
    # OTP builds the routing graph from GTFS on first run; subsequent starts
    # load the pre-built graph from the volume.
    #
    # To seed the graph with real Prasarana GTFS:
    #   docker compose run --rm otp --buildStreet --save
    # then restart with the default command below.
    #
    # Quick start (no GTFS graph — returns empty itineraries; OTP is still
    # reachable so the client falls back to template routes):
    #   docker compose up otp
    command: ["--load", "--serve"]
    volumes:
      - otp_graph:/var/opentripplanner
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xmx2g"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/otp/actuators/health"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s

volumes:
  clickhouse_data:
  otp_graph:
